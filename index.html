<h1>Droplet Island</h1>
<p>Droplet Island is a personal Dynamic Island for Windows: a small panel at the top of the screen with media controls, notes, reminders, screenshots, weather and a calendar.</p>
<p>It can show your Google Calendar events and add new ones. See the <a href="privacy.html">privacy policy</a>.</p>
<p>Contact: <a href="https://github.com/Reva1v">github.com/Reva1v</a></p>
